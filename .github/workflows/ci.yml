name: Verify Hotel Orchestrator
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
      - run: npm audit --audit-level=moderate
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker compose up --build -d --wait --wait-timeout 240
      - run: npm run test:e2e
      - name: Verify supplier downtime and recovery
        run: |
          SUPPLIER_B_DOWN=true docker compose up -d --no-deps --force-recreate api
          sleep 5
          test "$(curl -s -o /tmp/failure.json -w '%{http_code}' 'http://localhost:3000/api/hotels?city=delhi')" = 503
          test "$(curl -s -o /tmp/health.json -w '%{http_code}' 'http://localhost:3000/health')" = 503
          SUPPLIER_B_DOWN=false docker compose up -d --no-deps --force-recreate api
          npm run test:e2e
      - name: Verify worker restart
        run: |
          docker compose restart worker
          npm run test:e2e
      - name: Print service logs
        if: always()
        run: docker compose logs --no-color --tail=150
      - name: Stop stack
        if: always()
        run: docker compose down -v
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker build -f Dockerfile.demo -t hotel-demo .
      - run: docker run -d --name hotel-demo --memory=512m -p 3000:3000 hotel-demo
      - run: npm run test:e2e
      - name: Report memory and process status
        if: always()
        run: |
          docker stats --no-stream hotel-demo
          docker inspect hotel-demo --format '{{json .State}}'
          docker logs --tail 100 hotel-demo
      - name: Stop demo
        if: always()
        run: docker stop hotel-demo
